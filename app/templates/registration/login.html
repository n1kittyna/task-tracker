{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block content %}
<h1 class="h3 mb-3">Вход</h1>
<form method="post" class="card card-body col-md-5">
  {{ form.hidden_tag() }}
  {{ ui.field(form.username) }}
  {{ ui.field(form.password) }}
  {{ ui.check_field(form.remember) }}
  {{ form.submit(class="btn btn-primary") }}
  <a class="mt-2" href="{{ url_for('auth.register') }}">Нет аккаунта? Зарегистрироваться</a>
</form>
{% endblock %}
